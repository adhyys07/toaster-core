server {
    listen 80;
    server_name _;

    location /cores/ {
        alias /usr/share/nginx/html/cores/;
        autoindex on;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
        types {
            application/octet-stream dll;
        }
    }
}
